# ==========================================
# Application Configuration
# ==========================================
spring.application.name=dcss-case-management

# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/dcss_case_management
spring.datasource.username=postgres
spring.datasource.password=career$26
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Hibernate / JPA Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Logging Configuration
# ==========================================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.nys.dcss.casemanagement=DEBUG

# ==========================================
# Actuator Configuration
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always